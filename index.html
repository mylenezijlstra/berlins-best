<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berlin's Best - Tempelhofer Feld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"></div>
    <nav class="navigation"></nav>
    <div class="header-action"></div>
  </header>

  <main>
    <!-- Hero sectie met de interactieve slideshow -->
    <section class="hero">
      <div class="slideshow-wrapper">
        
        <!-- Viewport met foto's en navigatieknoppen -->
        <div class="slideshow-viewport" id="slideshow-viewport">
          <div class="slideshow-track" id="slideshow-track">
            <!-- Dynamisch gevuld door slideshow.js met 6 foto's (foto2.jpg t/m foto7.jpg) -->
          </div>

          <!-- Vorige knop -->
          <button class="nav-btn prev-btn" id="prev-btn" aria-label="Vorige foto">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>

          <!-- Volgende knop -->
          <button class="nav-btn next-btn" id="next-btn" aria-label="Volgende foto">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>

        <!-- Voortgangsbalk (3 seconden loop) -->
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Onderbalk: Dots links & Pauze/Speel knop rechts -->
        <div class="slideshow-controls">
          <div class="dots-container" id="dots-container"></div>

          <button class="control-btn" id="toggle-play-btn" aria-label="Pauzeer of speel slideshow">
            <svg id="pause-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <svg id="play-icon" style="display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Pauze / Speel</span>
          </button>
        </div>

      </div>
    </section>

    <section class="intro section-wrap">
      <div class="section-topline"></div>
      <div class="intro-columns">
        <div class="intro-heading"></div>
        <div class="intro-copy"></div>
      </div>
      <div class="timeline">
        <div></div><div></div><div></div><div></div>
      </div>
    </section>

    <section class="feature-band">
      <div class="section-wrap">
        <div class="feature-heading"></div>
        <div class="feature-columns">
          <div></div><div></div><div></div>
        </div>
      </div>
    </section>

    <section class="gallery section-wrap">
      <div class="section-heading">
        <div></div>
        <div></div>
      </div>
      <div class="gallery-image"></div>
      <div class="gallery-thumbnails">
        <div></div><div></div><div></div><div></div>
      </div>
    </section>

    <section class="visit section-wrap">
      <div class="visit-heading"></div>
      <div class="visit-details">
        <div></div><div></div><div></div>
      </div>
    </section>

    <section class="map-section section-wrap">
      <div class="section-heading">
        <div></div>
        <div></div>
      </div>
      <div class="map-panel"></div>
    </section>

    <section class="closing">
      <div class="closing-image"></div>
      <div class="closing-content">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div></div><div></div><div></div>
  </footer>

  <!-- Slideshow JavaScript -->
  <script src="slideshow.js"></script>
</body>
</html>
